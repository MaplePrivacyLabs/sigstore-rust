[package]
name = "maple-sigstore-rekor"
description = "Rekor transparency log client for Sigstore (Maple fork of sigstore-rekor 0.17.0 with P-384 Rekor v2 support)"
version = "0.17.0-maple.1"
edition.workspace = true
license.workspace = true
repository = "https://github.com/MaplePrivacyLabs/sigstore-rust"
readme = "README.md"
rust-version.workspace = true

[lib]
name = "sigstore_rekor"

[features]
default = ["rustls", "aws-lc-rs"]
client = ["dep:reqwest"]
rustls = ["client", "reqwest/rustls"]
rustls-no-provider = ["client", "reqwest/rustls-no-provider"]
native-tls = ["client", "reqwest/native-tls"]
aws-lc-rs = ["sigstore-merkle/aws-lc-rs"]

[dependencies]
sigstore-types = { workspace = true }
sigstore-merkle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true, optional = true }
thiserror = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
