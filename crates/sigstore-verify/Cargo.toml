[package]
name = "maple-sigstore-verify"
description = "Sigstore signature verification (fork of sigstore-verify 0.16.0 with P-384 Rekor v2 support)"
version = "0.16.0-p384.1"
edition.workspace = true
license.workspace = true
repository = "https://github.com/MaplePrivacyLabs/sigstore-rust"
rust-version.workspace = true
# These tests read corpora from the repository's test-vectors directory,
# which is not part of the package.
exclude = ["tests/conformance_vectors.rs", "tests/managed_key_corpus.rs"]
readme = "README.md"

[lib]
name = "sigstore_verify"

[dependencies]
sigstore-types = { workspace = true }
sigstore-crypto = { workspace = true }
sigstore-merkle = { workspace = true }
sigstore-trust-root = { workspace = true }
sigstore-bundle = { workspace = true, default-features = false }
sigstore-rekor = { workspace = true, default-features = false }
sigstore-tsa = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
base64 = { workspace = true }
x509-cert = { workspace = true, features = ["sct"] }
hex = { workspace = true }
const-oid = { workspace = true }
tls_codec = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pki-types = { workspace = true }
tracing = { workspace = true }
futures-io = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = { workspace = true }
regex = { workspace = true }
sigstore-trust-root = { workspace = true, features = ["tuf"] }

[features]
default = ["rustls", "aws-lc-rs"]
rustls = ["sigstore-trust-root/rustls"]
rustls-no-provider = ["sigstore-trust-root/rustls-no-provider"]
native-tls = ["sigstore-trust-root/native-tls"]
tuf = ["sigstore-trust-root/tuf"]
aws-lc-rs = ["sigstore-crypto/aws-lc-rs"]
