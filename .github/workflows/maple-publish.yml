name: Maple publish

# Publishes the two crates this fork changes, maple-sigstore-rekor and
# maple-sigstore-verify, to crates.io. Nothing else here publishes anything.
#
# It runs for a tag maple-v<version> and refuses unless the tagged commit is
# the head of a maple/<release>-publish branch that is exactly one commit on
# top of maple/<release>. The upload waits for a reviewer in the maple-crates
# environment. This file lives on the Maple branches only, never on main, so
# it follows each release line. MAPLE.md has the steps.
on:
  push:
    tags:
      - "maple-v*"

permissions: {}

# One release at a time; a second tag waits instead of racing the first.
concurrency:
  group: maple-publish
  cancel-in-progress: false

jobs:
  check:
    name: Check the release commit, test and dry-run
    if: >-
      github.repository == 'MaplePrivacyLabs/sigstore-rust' &&
      github.repository_id == '1461849084' &&
      github.repository_owner_id == '322649754'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      missing: ${{ steps.plan.outputs.missing }}
      auth: ${{ steps.plan.outputs.auth }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the release script
        run: python3 -I -m unittest discover -s .github/maple -p 'test_*.py'

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Refuse anything but a publish branch head, and read crates.io
        id: plan
        run: python3 -I .github/maple/publish.py plan

      - name: Run tests
        run: cargo test --all-features --workspace --locked

      # One invocation for both, so Cargo can build the second crate against
      # the first before either is in the registry.
      - name: Dry-run the crates that are not published yet
        if: steps.plan.outputs.missing != ''
        env:
          MISSING: ${{ steps.plan.outputs.missing }}
        run: |
          packages=()
          for crate in $MISSING; do packages+=(-p "$crate"); done
          cargo publish --dry-run --locked "${packages[@]}"

  publish:
    name: Publish to crates.io
    needs: check
    # Nothing to approve when both crates are already published at this version.
    if: needs.check.outputs.auth != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maple-crates
    permissions:
      contents: read
      id-token: write # the crates.io trusted-publishing exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      # crates.io offers trusted publishing only for a crate that already
      # exists. A crate's first version uses the environment's bootstrap token.
      - name: Obtain a short-lived crates.io credential
        id: auth
        if: needs.check.outputs.auth == 'trusted'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Repeats the release-commit check: the branches may have moved while
      # this job waited for approval.
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ needs.check.outputs.auth == 'bootstrap' && secrets.CRATES_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: python3 -I .github/maple/publish.py publish
